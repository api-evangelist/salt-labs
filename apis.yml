aid: salt-labs
name: Salt Labs
description: >-
  Salt Labs is the New York company behind Salt, an employee rewards and loyalty benefit for hourly
  and frontline workers. Founded in 2022 by Jason Lee and founding members of DailyPay, Salt turns
  time worked into a points-based asset: an employee earns one Salt for every hour on the job through
  the Salt Rewards mobile app, and redeems accumulated Salt for merchandise, travel, experiences,
  education benefits, and investment products such as stock and treasury bonds. Salt is sold to
  employers across transportation, contact centers, hospitality, and parking services as a retention
  and engagement program modeled on airline miles and credit-card points. Salt Labs was acquired by
  Chime Financial in June 2024 and now operates as "Salt, a Chime Company", with founder Jason Lee
  leading the Chime Enterprise business unit. Salt Labs publishes no public developer program, API
  reference, or machine-readable contract; its only machine-readable first-party surface is the
  Atlassian Statuspage at status.saltlabs.com, which exposes public JSON and RSS availability feeds
  for the Salt App Backend.
