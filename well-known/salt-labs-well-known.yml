note: >-
  Salt Labs serves NONE of the five /.well-known documents the rubric names — no security.txt,
  no api-catalog, no openid-configuration, no oauth-authorization-server, no
  oauth-protected-resource — on any of its hosts. Every one of those paths returns an honest 404
  that the host distinguishes from its live pages (see the per-host controls). What it does serve,
  on the app backend, are the two mobile deep-link association documents that bind the Salt Rewards
  iOS and Android apps to app.saltlabs.com; those are real, first-party, and saved verbatim here,
  but they are app-linking metadata, not an API discovery surface, so no WellKnown pointer is
  emitted from this file. The one security.txt in this probe, on status.saltlabs.com, is NOT Salt
  Labs': it is the Atlassian Statuspage platform's own PGP-signed document (Canonical
  https://www.atlassian.com/.well-known/security.txt, Contact security@atlassian.com), served by
  the vendor on every hosted status page, and it is deliberately not credited to Salt Labs. No
  SecurityTxt pointer is emitted either.
